name: SpotifyClone
options:
  bundleIdPrefix: com.spotifyclone.app
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  SpotifyClone:
    type: application
    platform: iOS
    sources:
      - path: SpotifyClone
        excludes:
          - "Info.plist"
    info:
      path: SpotifyClone/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spotifyclone.app
        PRODUCT_NAME: SpotifyClone
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        ENABLE_PREVIEWS: YES
        # Signing is intentionally left open here — CI builds unsigned by
        # passing CODE_SIGNING_ALLOWED=NO. If you build locally in Xcode,
        # pick your own Team under Signing & Capabilities instead.
        CODE_SIGN_STYLE: Automatic
